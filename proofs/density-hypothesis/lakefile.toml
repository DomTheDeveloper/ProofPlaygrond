name = "density_hypothesis"
defaultTargets = ["DensityHypothesis"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# The Mathlib release that google-deepmind/formal-conjectures pins at commit 9097e2f.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "DensityHypothesis"

# Statements only (Mathlib-only; its `sorry`s are deliberate) and the module that proves them.
[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
