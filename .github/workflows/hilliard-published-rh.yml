name: Hilliard with the published compact RH modules
on:
  push:
    branches: [verify/hilliard-published-rh-20261127]
    paths: ['.github/workflows/hilliard-published-rh.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    defaults:
      run:
        shell: bash
        working-directory: proofs/hilliard-four-primes
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 10aba6b9b27de5d772b3cceb6f496427c4851db8
      - name: Make room for the pinned Lean libraries
        run: |
          df -h .
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .
      - name: Install elan
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh --output "$RUNNER_TEMP/install-elan.sh"
          bash "$RUNNER_TEMP/install-elan.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the pinned upstream projects and Mathlib cache
        run: bash setup.sh
      - name: Verify the cache and compile the pinned proof
        run: |
          set -euo pipefail
          ulimit -s unlimited
          export LEAN_NUM_THREADS=3
          proof_dir=$PWD
          cache_ref=1053c8dddfb0a168e8a60ac437d06f665fd012df
          cache_checkout=$(mktemp -d)
          git -C "$cache_checkout" init -q
          git -C "$cache_checkout" fetch --depth=1 -q https://github.com/leanprover-community/riemann-hypothesis.git "$cache_ref"
          git -C "$cache_checkout" checkout -q --detach "$cache_ref"
          rh_project="$cache_checkout/grh-compact"
          published_tree=$(git -C "$rh_project" rev-parse 'HEAD:grh-compact/src')
          pinned_tree=$(git -C .lake/packages/grh-lean rev-parse 'HEAD:grh-compact/src')
          test "$published_tree" = "$pinned_tree"
          cmp lean-toolchain "$rh_project/lean-toolchain"
          mkdir -p "$rh_project/.lake"
          ln -s "$proof_dir/.lake/packages" "$rh_project/.lake/packages"
          echo "Restoring compiled RH source tree $published_tree"
          python3 "$rh_project/scripts/ci-cache-get.py" --project "$rh_project" --jobs 4
          lake build --fail-fast +CubeProof:olean @SchoenfeldRH/+SchoenfeldRH.Main:olean
          output_dir=$(mktemp -d)
          project_paths=$(lake env printenv LEAN_PATH)
          export LEAN_PATH="$output_dir:$rh_project/.lake/build/lib/lean:$project_paths"
          lean_bin=$(elan which lean)
          "$lean_bin" -o "$output_dir/BoundSolution.olean" BoundSolution.lean
          "$lean_bin" -o "$output_dir/Hilliard.olean" Hilliard.lean | tee "$RUNNER_TEMP/hilliard-axioms.txt"
          python - "$RUNNER_TEMP/hilliard-axioms.txt" <<'PY'
          from pathlib import Path
          import re, sys
          output = Path(sys.argv[1]).read_text()
          match = re.search(r"'CubePrimes\.hilliard_four_primes_between_cubes' depends on axioms:\s*\[([^\]]*)\]", output)
          if not match:
              raise SystemExit("Missing axiom report for the unconditional theorem")
          axioms = {item.strip() for item in match.group(1).split(',')}
          if axioms != {"propext", "Classical.choice", "Quot.sound"}:
              raise SystemExit("Unexpected axiom report: " + repr(axioms))
          PY
