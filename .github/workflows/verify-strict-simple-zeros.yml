name: Verify the strict simple-zero proportion
on:
  push:
    branches: [verify-strict-simple-zeros-7d777823]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: proofs/riemann-zeta-simple-proportion
      - name: Install elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check theorem and axioms
        run: proofs/riemann-zeta-simple-proportion/verify.sh
