          key: a280831-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}
          restore-keys: a280831-${{ runner.os }}-
      - name: Fetch pinned Mathlib cache
        run: |
          set -euo pipefail
