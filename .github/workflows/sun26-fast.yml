name: Sun 2.6 fast exact audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sun26-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: finite and analytic proof
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout active Sun proof
        uses: actions/checkout@v6
        with:
          repository: DomTheDeveloper/formal-conjectures
          ref: statement/sun-2-7-i
          fetch-depth: 1
      - name: Record exact commit
        run: git rev-parse HEAD | tee "$RUNNER_TEMP/sha.txt"
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .lake/packages
            .lake/build
          key: sun26-fast-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}
          restore-keys: sun26-fast-${{ runner.os }}-
      - name: Fetch Mathlib cache and build native_decide
        run: |
          set -euo pipefail
          lake exe cache unpack || true
          lake exe cache get
          lake build Mathlib.Tactic.NativeDecide
      - name: Reject placeholders and trust escapes
        run: |
          set -euo pipefail
          targets=(FormalConjectures/SunConjectures/2_6Finite.lean FormalConjectures/SunConjectures/2_6Proof.lean)
          if grep -nE '\b(sorry|admit|unsafe)\b|(^|[^A-Za-z])axiom([^A-Za-z]|$)|Lean\.(trustCompiler|ofReduce|ofReduceBool)' "${targets[@]}"; then
            exit 1
          fi
      - name: Compile finite theorem
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/sun26.log"
          mkdir -p .lake/build/lib/lean/FormalConjectures/SunConjectures
          lake env lean \
            -o .lake/build/lib/lean/FormalConjectures/SunConjectures/2_6Finite.olean \
            FormalConjectures/SunConjectures/2_6Finite.lean \
            2>&1 | tee -a "$RUNNER_TEMP/sun26.log"
      - name: Compile analytic theorem
        run: |
          set -o pipefail
          lake env lean \
            -o .lake/build/lib/lean/FormalConjectures/SunConjectures/2_6Proof.olean \
            FormalConjectures/SunConjectures/2_6Proof.lean \
            2>&1 | tee -a "$RUNNER_TEMP/sun26.log"
      - name: Enforce axiom policy
        run: |
          set -euo pipefail
          ! grep -E 'sorryAx|Lean\.(trustCompiler|ofReduce|ofReduceBool)' "$RUNNER_TEMP/sun26.log"
      - name: Upload transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sun26-fast-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sha.txt
            ${{ runner.temp }}/sun26.log
