name = "StrictSimpleZeros"
version = "0.1.0"
defaultTargets = ["SimplePropLt"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "51e6992efd06126df61a496bebf8f49482a4e129"

[[lean_lib]]
name = "Zeta23"
globs = ["Zeta23.+"]
leanOptions = { relaxedAutoImplicit = false }

[[lean_lib]]
name = "Zeta23Ext"
globs = ["Zeta23Ext.+"]

[[lean_lib]]
name = "ThreePoint"
globs = ["ThreePoint.+"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }

[[lean_lib]]
name = "SimplePropLt"
